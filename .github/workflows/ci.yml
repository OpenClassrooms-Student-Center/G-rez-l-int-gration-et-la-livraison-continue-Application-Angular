name: CI

# Same file is used, unmodified, in the Gradle (Java) and npm (Angular)
# repos. The "test" job below auto-detects which one it's running in.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Actually set at runtime by "Detect project type" below (via
      # $GITHUB_ENV). Declared here with an empty default just so the
      # editor's static linter recognizes env.PROJECT_TYPE downstream.
      PROJECT_TYPE: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project type
        run: |
          if [[ -f gradlew && ( -f build.gradle || -f build.gradle.kts ) ]]; then
            echo "PROJECT_TYPE=gradle" >> "$GITHUB_ENV"
          elif [[ -f package.json ]]; then
            echo "PROJECT_TYPE=npm" >> "$GITHUB_ENV"
          else
            echo "::error::Unable to detect project type (expected gradlew+build.gradle or package.json)"
            exit 1
          fi

      - name: Set up JDK 21
        if: env.PROJECT_TYPE == 'gradle'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node 20
        if: env.PROJECT_TYPE == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Run unit tests
        run: ./run-tests.sh

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Unit Tests
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: true

  # Builds the Docker image (same Dockerfile layout in both repos) and
  # pushes it to GHCR, tagged with the commit's short SHA so every
  # build is traceable back to the exact commit that produced it.
  build:
    name: Build & push Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name and tag
        id: image
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          IMAGE_NAME=$(echo "$REGISTRY/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
